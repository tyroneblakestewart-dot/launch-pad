  .desktopAdvancedToggle b { color: #55ff78; font-size: 18px; }
  .desktopAdvancedField { display: none !important; }
  .desktopAdvancedField.desktopAdvancedVisible { display: block !important; }
  .actionGrid.desktopAdvancedVisible { display: grid !important; grid-template-columns: 1fr 1fr; }
  .copyRows.desktopAdvancedVisible { display: grid !important; }
  .toggleRow.desktopAdvancedVisible { display: flex !important; }
  .developerRow > .desktopAdvancedVisible { display: block !important; }
  .mobileLaunchButton { display: none !important; }

  .desktopLaunchMeta {
