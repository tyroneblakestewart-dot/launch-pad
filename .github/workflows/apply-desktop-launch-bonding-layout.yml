name: Apply desktop launch and bonding layout

on:
  push:
    branches:
      - feat/desktop-launch-bonding-layout

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/desktop-launch-bonding-layout
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Apply desktop-only layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          provider = Path("components/provider-launcher.tsx")
          text = provider.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f"Missing expected provider snippet: {label}")
              text = text.replace(old, new, 1)

          replace_once(
              '  const [buyOpened, setBuyOpened] = useState(false);\n',
              '  const [buyOpened, setBuyOpened] = useState(false);\n  const [advancedOpen, setAdvancedOpen] = useState(false);\n',
              'advanced state',
          )

          replace_once(
              '''  const providerProofFailed = Boolean(
              verification?.transactionHash && verification.factoryConfirmed === false,
            );

            return (
          ''',
              '''  const providerProofFailed = Boolean(
              verification?.transactionHash && verification.factoryConfirmed === false,
            );
            const launchReady = Boolean(
              name.trim() &&
              ticker.trim() &&
              description.trim() &&
              (!immediateBuyEnabled || isPositiveAmount(developerBuy))
            );

            return (
          ''',
              'launch readiness',
          )

          replace_once(
              '''          <div className={styles.sectionHeading}>
                        <div><p>STEP 1</p><h2>Prepare launch data</h2></div>
          ''',
              '''          <div className={`${styles.sectionHeading} ${styles.launchHeading}`}>
                        <div>
                          <p>STEP 1</p>
                          <h2>Launch token</h2>
                          <small className={styles.desktopIntro}>Enter the core launch details, then review the live summary before opening the provider.</small>
                        </div>
          ''',
              'launch heading',
          )

          replace_once(
              '          <label>\n            <span>Saved Robinhood project</span>',
              '          <label className={styles.savedProjectField}>\n            <span>Saved Robinhood project</span>',
              'saved project class',
          )

          replace_once(
              '''          <div className={styles.twoColumns}>
                        <label><span>Name</span><input value={name} onChange={(event) => setName(event.target.value)} maxLength={32} /></label>
                        <label><span>Ticker</span><input value={ticker} onChange={(event) => setTicker(event.target.value.replace(/[^a-zA-Z0-9]/g, "").slice(0, 10))} /></label>
                      </div>
          ''',
              '''          <div className={`${styles.twoColumns} ${styles.tokenIdentityFields}`}>
                        <label>
                          <span>Name</span>
                          <input value={name} onChange={(event) => setName(event.target.value)} maxLength={32} />
                          <small className={styles.fieldHelp}>Up to 32 characters.</small>
                        </label>
                        <label>
                          <span>Ticker</span>
                          <input value={ticker} onChange={(event) => setTicker(event.target.value.replace(/[^a-zA-Z0-9]/g, "").slice(0, 10))} />
                          <small className={styles.fieldHelp}>Letters and numbers, up to 10.</small>
                        </label>
                      </div>
          ''',
              'identity fields',
          )

          replace_once(
              '          <label><span>Description</span><textarea value={description} onChange={(event) => setDescription(event.target.value)} rows={5} /></label>',
              '''          <label className={styles.descriptionField}>
                        <span>Description</span>
                        <textarea value={description} onChange={(event) => setDescription(event.target.value)} rows={5} />
                        <small className={styles.fieldHelp}>A short, clear project description copied into the provider launch pack.</small>
                      </label>''',
              'description field',
          )

          replace_once(
              '          <label><span>Website</span><input value={website} onChange={(event) => setWebsite(event.target.value)} placeholder="https://..." /></label>',
              '          <label className={`${styles.websiteField} ${styles.desktopAdvancedField} ${advancedOpen ? styles.desktopAdvancedVisible : ""}`}><span>Website</span><input value={website} onChange={(event) => setWebsite(event.target.value)} placeholder="https://..." /></label>',
              'website advanced class',
          )

          replace_once(
              '''          <div className={styles.twoColumns}>
                        <label><span>X profile</span><input value={xHandle} onChange={(event) => setXHandle(event.target.value)} placeholder="x.com/..." /></label>
                        <label><span>Telegram</span><input value={telegram} onChange={(event) => setTelegram(event.target.value)} placeholder="t.me/..." /></label>
                      </div>
          ''',
              '''          <div className={`${styles.twoColumns} ${styles.socialFields}`}>
                        <label><span>X profile</span><input value={xHandle} onChange={(event) => setXHandle(event.target.value)} placeholder="x.com/..." /></label>
                        <label><span>Telegram</span><input value={telegram} onChange={(event) => setTelegram(event.target.value)} placeholder="t.me/..." /></label>
                      </div>
          ''',
              'social fields',
          )

          replace_once(
              '''          <div className={styles.twoColumns}>
                        <label><span>Creator wallet</span><input value={creatorWallet} onChange={(event) => setCreatorWallet(event.target.value)} placeholder="0x..." /></label>
                        <label><span>Initial buy amount (ETH)</span><input value={developerBuy} onChange={(event) => setDeveloperBuy(event.target.value.replace(/[^0-9.]/g, ""))} inputMode="decimal" /></label>
                      </div>
          ''',
              '''          <div className={`${styles.twoColumns} ${styles.developerRow}`}>
                        <label className={`${styles.desktopAdvancedField} ${advancedOpen ? styles.desktopAdvancedVisible : ""}`}><span>Creator wallet</span><input value={creatorWallet} onChange={(event) => setCreatorWallet(event.target.value)} placeholder="0x..." /></label>
                        <label><span>Developer buy</span><input value={developerBuy} onChange={(event) => setDeveloperBuy(event.target.value.replace(/[^0-9.]/g, ""))} inputMode="decimal" /><small className={styles.fieldHelp}>Initial creator-buy amount in test ETH. Existing provider rules still apply.</small></label>
                      </div>
          ''',
              'developer row',
          )

          replace_once(
              '          <label className={styles.toggleRow}>',
              '          <label className={`${styles.toggleRow} ${styles.desktopAdvancedField} ${advancedOpen ? styles.desktopAdvancedVisible : ""}`}>',
              'toggle advanced class',
          )

          replace_once(
              '          <label className={styles.artworkBox}>',
              '          <label className={`${styles.artworkBox} ${styles.artworkField}`}>',
              'artwork field class',
          )

          replace_once(
              '''          </label>

                      <div className={styles.actionGrid}>
          ''',
              '''          </label>

                      <button
                        type="button"
                        className={styles.desktopAdvancedToggle}
                        onClick={() => setAdvancedOpen((current) => !current)}
                        aria-expanded={advancedOpen}
                      >
                        <span>Advanced settings</span>
                        <b>{advancedOpen ? "−" : "+"}</b>
                      </button>

                      <div className={`${styles.actionGrid} ${styles.desktopAdvancedField} ${advancedOpen ? styles.desktopAdvancedVisible : ""}`}>
          ''',
              'advanced toggle insertion',
          )

          replace_once(
              '<button className={styles.launchButton} onClick={openProvider}>Launch on {provider.name} ↗</button>',
              '<button className={`${styles.launchButton} ${styles.mobileLaunchButton}`} onClick={openProvider}>Launch on {provider.name} ↗</button>',
              'mobile launch button class',
          )

          replace_once(
              '          <div className={styles.copyRows}>',
              '          <div className={`${styles.copyRows} ${styles.desktopAdvancedField} ${advancedOpen ? styles.desktopAdvancedVisible : ""}`}>',
              'copy rows advanced class',
          )

          replace_once(
              '''            ))}
                      </div>
                    </div>

                    <aside className={styles.verifyPanel}>
          ''',
              '''            ))}
                      </div>

                      <div className={styles.desktopLaunchMeta}>
                        <div><span>Network</span><b>Robinhood Chain Testnet</b></div>
                        <div><span>Provider</span><b>{provider.name}</b></div>
                        <div><span>Launch fee</span><b>Confirmed on provider</b></div>
                      </div>

                      <button
                        className={styles.desktopPrimaryLaunch}
                        onClick={openProvider}
                        disabled={!launchReady || busy}
                      >
                        Launch on {provider.name} ↗
                      </button>
                    </div>

                    <aside className={styles.verifyPanel}>
                      <div className={styles.desktopTokenSummary} aria-live="polite">
                        <p>LIVE TOKEN SUMMARY</p>
                        <div className={styles.summaryArtwork}>
                          {artwork ? (
                            // eslint-disable-next-line @next/next/no-img-element
                            <img src={artwork} alt="Token summary artwork" />
                          ) : (
                            <span>{ticker.trim().slice(0, 1).toUpperCase() || "H"}</span>
                          )}
                        </div>
                        <div className={styles.summaryIdentity}>
                          <h2>{name.trim() || "Your token"}</h2>
                          <span>${ticker.trim().toUpperCase() || "TICKER"}</span>
                        </div>
                        <dl>
                          <div><dt>Launch fee</dt><dd>Confirmed on provider</dd></div>
                          <div><dt>Trading fee</dt><dd>Provider terms</dd></div>
                          <div><dt>Graduation target</dt><dd>Provider-managed</dd></div>
                          <div><dt>Liquidity</dt><dd>Provider-managed</dd></div>
                          <div><dt>Network</dt><dd>Robinhood testnet</dd></div>
                        </dl>
                      </div>
          ''',
              'desktop summary and primary action',
          )

          provider.write_text(text)

          provider_css = Path("components/provider-launcher.module.css")
          provider_css.write_text(provider_css.read_text() + r'''

/* Desktop-only form simplification. Existing <=900px layout remains unchanged. */
.desktopIntro,
.fieldHelp,
.desktopAdvancedToggle,
.desktopLaunchMeta,
.desktopPrimaryLaunch,
.desktopTokenSummary {
  display: none;
}

@media (min-width: 901px) {
  .workspace {
