    margin-top: 2px;
    padding: 16px;
    border: 1px solid rgba(131, 183, 139, .16);
    border-radius: 10px;
    background: #080c09;
  }

  .desktopLaunchMeta div { display: grid; gap: 6px; }
  .desktopLaunchMeta span { color: #758178; font: 700 9px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .08em; }
