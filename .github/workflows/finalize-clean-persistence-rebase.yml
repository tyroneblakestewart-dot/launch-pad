name: Finalize clean persistence rebase

on:
  push:
    branches:
      - rebase/durable-public-site-persistence-clean

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebase/durable-public-site-persistence-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate dependency lock
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Confirm rollback files stay untouched
        run: |
          if git diff --name-only origin/main...HEAD | grep -E '(^|/)(site-design-variants|generated-site-variants|generated-site-variant-selector)'; then
            echo 'Five-design variant files must not be present in the durable publishing diff.'
            exit 1
          fi
      - name: Commit lockfile and remove workflow
        run: |
          rm .github/workflows/finalize-clean-persistence-rebase.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/finalize-clean-persistence-rebase.yml
          git commit -m "Finalize clean durable publishing rebase"
          git push origin HEAD:rebase/durable-public-site-persistence-clean
